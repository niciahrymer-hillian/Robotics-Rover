<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="560" fill="#0d0d12"/>
  <rect width="960" height="560" fill="url(#grid)"/>

  <text x="24" y="34" fill="#e6e6e6" font-size="20" font-weight="600">Robotics-Rover — Wiring</text>
  <text x="24" y="54" fill="#94a3b8" font-size="12">Two separate power domains — logic and motors never share a regulator, only ground</text>

  <!-- Logic domain box -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <rect x="24" y="80" width="420" height="220" rx="10"/>
  </g>
  <text x="40" y="102" fill="#38bdf8" font-size="12" font-weight="600">LOGIC POWER DOMAIN</text>

  <!-- MCU -->
  <rect x="50" y="120" width="170" height="100" rx="6" fill="#14141c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="135" y="146" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">Arduino Uno / ESP32</text>
  <g font-size="9" fill="#94a3b8">
    <text x="62" y="168">PWM A, DIR A →</text>
    <text x="62" y="182">PWM B, DIR B →</text>
    <text x="62" y="196">GND (shared only)</text>
  </g>

  <!-- IR/ultrasonic sensors -->
  <rect x="260" y="120" width="160" height="100" rx="6" fill="#14141c" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="340" y="146" fill="#e6e6e6" font-size="11" text-anchor="middle" font-weight="600">Sensors (optional)</text>
  <text x="340" y="164" fill="#94a3b8" font-size="9" text-anchor="middle">IR line-follower pair, or</text>
  <text x="340" y="178" fill="#94a3b8" font-size="9" text-anchor="middle">ultrasonic distance sensor</text>
  <line x1="220" y1="160" x2="260" y2="160" stroke="#a78bfa" stroke-width="2"/>

  <!-- logic battery -->
  <rect x="50" y="245" width="170" height="40" rx="6" fill="#14141c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="135" y="270" fill="#94a3b8" font-size="10" text-anchor="middle">Logic battery / USB (separate!)</text>
  <line x1="135" y1="220" x2="135" y2="245" stroke="#f97316" stroke-width="2"/>

  <!-- Motor domain box -->
  <g stroke="#f97316" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <rect x="480" y="80" width="450" height="380" rx="10"/>
  </g>
  <text x="496" y="102" fill="#f97316" font-size="12" font-weight="600">MOTOR POWER DOMAIN — separate battery, own supply</text>

  <!-- Driver -->
  <rect x="520" y="130" width="180" height="100" rx="6" fill="#14141c" stroke="#f97316" stroke-width="1.5"/>
  <text x="610" y="156" fill="#e6e6e6" font-size="12" text-anchor="middle" font-weight="600">TB6612FNG driver</text>
  <text x="610" y="172" fill="#94a3b8" font-size="9" text-anchor="middle">(not an L298N — lower V drop)</text>
  <g font-size="9" fill="#94a3b8">
    <text x="532" y="192">AIN1/2, BIN1/2 ← logic</text>
    <text x="532" y="206">VM → motor battery</text>
  </g>

  <!-- logic to driver signal wires -->
  <polyline points="220,168 480,168 520,192" fill="none" stroke="#4ade80" stroke-width="2"/>
  <polyline points="220,182 470,182 470,206 520,206" fill="none" stroke="#4ade80" stroke-width="2"/>
  <text x="230" y="230" fill="#4ade80" font-size="9">shared GND, signal only —</text>
  <text x="230" y="244" fill="#4ade80" font-size="9">not the motor power rail</text>

  <!-- Motors -->
  <rect x="750" y="130" width="80" height="70" rx="30" fill="#14141c" stroke="#f97316" stroke-width="1.5"/>
  <text x="790" y="170" fill="#e6e6e6" font-size="10" text-anchor="middle">Motor L</text>
  <rect x="850" y="130" width="80" height="70" rx="30" fill="#14141c" stroke="#f97316" stroke-width="1.5"/>
  <text x="890" y="170" fill="#e6e6e6" font-size="10" text-anchor="middle">Motor R</text>
  <line x1="700" y1="150" x2="750" y2="150" stroke="#f97316" stroke-width="2"/>
  <line x1="700" y1="180" x2="850" y2="180" stroke="#f97316" stroke-width="2"/>

  <!-- motor battery -->
  <rect x="520" y="260" width="180" height="60" rx="6" fill="#14141c" stroke="#f97316" stroke-width="1.5"/>
  <text x="610" y="284" fill="#e6e6e6" font-size="11" text-anchor="middle" font-weight="600">Motor battery pack</text>
  <text x="610" y="300" fill="#94a3b8" font-size="9" text-anchor="middle">rated by continuous-discharge, not mAh</text>
  <line x1="610" y1="260" x2="610" y2="230" stroke="#f97316" stroke-width="2"/>

  <!-- chassis note -->
  <rect x="520" y="345" width="390" height="100" rx="6" fill="#14141c" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="715" y="368" fill="#e6e6e6" font-size="11" text-anchor="middle" font-weight="600">Chassis</text>
  <text x="715" y="386" fill="#94a3b8" font-size="9" text-anchor="middle">2WD or 4WD kit — metal-gearbox tier holds</text>
  <text x="715" y="400" fill="#94a3b8" font-size="9" text-anchor="middle">up far better than all-plastic under stall load</text>
  <text x="715" y="420" fill="#94a3b8" font-size="9" text-anchor="middle">Driver sized for stall current, not running current</text>

  <!-- Legend -->
  <g font-size="10" fill="#94a3b8">
    <text x="30" y="500" fill="#e6e6e6" font-weight="600">Legend</text>
    <line x1="30" y1="512" x2="54" y2="512" stroke="#f97316" stroke-width="2"/><text x="60" y="516">Motor power (its own supply)</text>
    <line x1="30" y1="528" x2="54" y2="528" stroke="#4ade80" stroke-width="2"/><text x="60" y="532">Logic → driver signal (PWM/DIR)</text>
    <line x1="30" y1="544" x2="54" y2="544" stroke="#a78bfa" stroke-width="2"/><text x="60" y="548">Sensor input</text>
  </g>
  <g font-size="10" fill="#f97316">
    <text x="480" y="500" font-weight="600">⚠ The #1 rover failure:</text>
    <text x="480" y="516" fill="#94a3b8">powering motors and logic from the</text>
    <text x="480" y="530" fill="#94a3b8">same regulator — motor start-up current sags</text>
    <text x="480" y="544" fill="#94a3b8">the voltage and browns out the microcontroller.</text>
  </g>
</svg>
